name: dogrula

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Haftalık: bağımlılıksız araçlar sessizce çürümesin.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogrula:
    name: tek giris dogrulama
    runs-on: ubuntu-latest
    # 141 vakalik batarya, ikinci katman oz-test mutasyonu ve iki tam
    # dogrulama kosusu 35 dk'yi asabiliyor; taze klon + kanit paketi ayni is
    # icinde kosuyor.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Kanit kendi commit'ini degil, uretildigi HEAD'i cikalar; kayitli
          # commit'in runner'da cozulmesi icin tam gecmis gerekir.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surumler
        run: python3 --version && bash --version | head -1

      - name: Bagimliliklar
        run: python3 -m pip install --quiet -r requirements-dev.txt

      # DURUM.md elle yazilmaz. Bu adim ATLAS/KOD oz-testlerini yeniden kosar,
      # pinli envanter ve SURUM C15f bloguyla karsilastirir; sayfa bayatsa kirmizi.
      - name: DURUM sayfasi guncel mi
        run: make durum-kontrol

      # Sayfa/pin/canli sapmalarin rc!=0 verdigini gecici kokte kanitla.
      # Bu adim yalnizca dosya karsilastiran bir kisayolu ve devre disi canli
      # testleri kirmizi yakalar; gercek agaca yazmaz.
      - name: DURUM negatif testleri
        run: make durum-selftest

      # Ham agac: H4'un kendi tarayicisindan bagimsiz, dogrudan secret_scan.
      # Once agacin temiz oldugunu dogrula; boylece "--tum" yalniz izlenen
      # agaci tarar. Gercek sir (P0) veya KISMI mod cikisi bu adimi kirmizi yapar.
      - name: Ham sir taramasi (secret_scan --tum)
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 KOD_SABLONLAR/scripts/secret_scan.py --tum

      # Runner kipi: aynı kurallar, ayrı muafiyet yok. Sekiz kalemin tamamı
      # koşar; T1 (OLG-1) bu ağacın attestation.json kanıtıyla çalışır ve
      # çıktısında kendi commit/tree çıpasını basar
      # (ör. `OZ-TEST: 145/145 gecti · KANIT commit=<sha> tree=<sha>`).
      # Bir kalem koşmazsa satır
      # `KABUL EDİLEN BORÇ: <id> koşmuyor — <sebep>` olarak görünür ve PASS
      # sayılmaz; koşan 8/8 ile eksik koşu arasındaki fark gizlenmez.
      # katalog-selftest is an offline prerequisite of dogrula-ci.
      # The live models.dev gate (make katalog-kontrol) intentionally runs outside CI.
      # Sir fiksturu muafiyetinin regresyon testi. `make dogrula` bunu on
      # kosul olarak kosar; burada ayrica dogrudan baglanir ki kirmizi adim
      # adiyla gorunsun: bilinen satir sessiz, satir/dosya degisimi P0, bozuk
      # manifest fail-closed.
      - name: Sir fiksturu muafiyeti (sessiz / P0 / fail-closed)
        run: make fikstur-muafiyet-test

      # Katalog kapisinin negatif dallari ayri bir CI adimi olarak gorunur:
      # on rol fiksturu, maliyet/limit/kimlik/deprecated/ag ve OLCULMEDI.
      # `make dogrula-ci` bunu zaten on kosul olarak kosar; buradaki acik
      # adim, regresyonu serbest metin bir on kosulun arkasina saklamaz.
      - name: Katalog kapisi oz-testi (negatif dallar)
        run: make katalog-selftest

      # Canli models.dev/katalog hedefi zorunlu CI'ya geri donmemeli. Denetim
      # yalniz push/PR workflow'larini tarar; schedule/manual canary disaridadir.
      - name: Canli katalog CI'ya sizmadi mi
        run: make ci-katalog-denetim

      # JSONL kanit kaydi yalniz eklenir; sema/sira/commit/tree/tanim hash'leri
      # ve git gecmisi denetlenir. Elle duzenlenmis satir burada kirmizi olur.
      - name: Katalog kanit kaydi (append-only / sema)
        run: make katalog-kayit-dogrula

      - name: make dogrula-ci
        run: make dogrula-ci

      # GitHub kod arama sozlesmesi agsiz sahte API ile sinanir. Canli sorgu
      # token ve guncel indeks gerektirir; CI hukmune dahil edilmez.
      - name: Kod arama sozlesmesi (agsiz)
        run: make kamu-arama-selftest

      # Agac kaniti: gercek commit + dosya sha256'lari + guncel agac uyumu.
      # Kayitli commit'in cozulmesi icin checkout tam gecmisi indirir.
      - name: Agac kaniti guncel mi
        run: make kanit-dogrula

      # KANIT-00..06'nin her kodu gercek bir bozulmayla ateslenmeli. Vaka
      # beklenen kodu vermezse veya ana agac degisirse is kirmizi olur.
      - name: Kanit kapisi negatif kontrolu (KANIT-00..06)
        run: make kanit-negatif

      # OLG-1 negatif kontrolu: ana agac degismeden gecici bir klonda
      # attestation commit'i bozulur. `olgu_lint` KANIT_GECERSIZ ile rc=1
      # vermeli; `atlas_selftest` 145/146 ile kalmali. Kapi zayiflarsa veya
      # negatif kontrol sessizce kosmazsa bu adim kirmizi olur.
      - name: OLG-1 negatif kontrolu
        run: make olgu-negatif

      # Kapı kanıtı: her kural için temiz taban + tek ihlal; hata vakasında kırmızı,
      # beklenen-bulgu vakasında işaretli bulgu.
      # Model, ağ ve yerel katalog gerektirmez; bu yüzden runner'da hükme girer.
      - name: make mutasyon
        run: make mutasyon

      # Mutasyon sayilari kamu anlatimina elle yazilir. Kapi 109/91/18 ve
      # guncel 141/113/28 sayilarini vaka katalogundan turetir; README, docs
      # ve iddia defteri ayrisirsa ya da tek-sozlesmeli (141/141) ifade
      # girerse kirmizi olur. Bataryadan SONRA kosar: kayit taze olsun.
      - name: Mutasyon anlatimi katalogla tutarli mi
        run: make mutasyon-anlatim

      # Pozitif taban + 11 negatif vaka: sayi, sozlesme, uyelik, takma ad,
      # defter ve tek-sozlesmeli ifade bozulunca kapinin gercekten dustugunu
      # gecici koklerde olcer; gercek agaca yazmaz.
      - name: Mutasyon anlatimi kapisi negatif testleri
        run: make mutasyon-anlatim-selftest

      # Dort sir kapisi kenarinin duzeltmesi geri alininca ilgili selftest
      # vakasinin FAIL verdigini ve duzeltmeyle PASS verdigini yeniden olcer.
      # Kayit JSON'u ve DEVIR blogu bu kosudan uretilir; bayatlarsa kirmizi.
      - name: Sir kapisi mutasyon kaniti
        run: make sir-mutasyon

      # Ikinci katman: hedef kapiyi bozunca ilgili oz-test kimligi PASS->FAIL
      # gecmeli. Ayni adim kosulsuz True gecen ve bos govdeli testleri de AST
      # ile tarar; sentetik fiksturle dedektorun atesledigini ayrica sinar.
      - name: Oz-test ikinci katman mutasyonu
        run: make oztest-mutasyon

      # Tablo elle yazilmaz; kapi envanteri degisip tablo bayatlarsa kirmizi.
      # Kapsam regresyon ratchet'i de bu adimdadir: test edilen kural 93'un
      # altina duserse veya bosluk 0'in ustune cikarsa make kapsam rc=1 doner.
      - name: Mutasyon kapsami ve regresyon ratchet
        run: make kapsam

      # Ratchet'in yalnizca mevcut agacta degil, yeni kural eklenen gecici
      # kopyada da kirmizi/yesil oldugunu olcer; canli agaca yazmaz.
      - name: Kapsam ratchet negatif testleri
        run: make kapsam-selftest

      # Gelistirme agacindaki .venv veya izlenmeyen bir dosya temiz klonda
      # yoktur. Temiz klonda venv kurulur; dogrula 8/8, kanit-dogrula temiz,
      # demo rc=2 ve agsiz iddia PASS olmadan bu adim yesil donmez. Eksik
      # izlenen dosya veya kirli agac da kirmizidir.
      - name: Taze klon yeniden uretim
        run: make taze-klon

      # Bulgular gizlenmez: her biri docs/GUVENLIK.md icinde adiyla listelenir;
      # listede olmayan yeni bulgu cikarsa adim kirmizi doner.
      - name: Bagimlilik denetimi (pip-audit)
        run: make guvenlik

      # Surumler sabit oldugu icin rapor her runner'da ayni olmali; farkliysa
      # ortam cozunurlugu kaymis demektir ve bu sessizce gecmemeli.
      - name: Guvenlik raporu guncel mi
        run: git diff --exit-code docs/GUVENLIK.md

      # Demo 0/1/2: gecici fiksturlerle yesil (rc=0), kirmizi (rc=1) ve bozuk
      # (rc=2) sozlesmesini ayri ayri dogrula. DENEME/ degismez; kaynak yalnizca
      # gecici kopyada okunur.
      - name: Demo 0/1/2 öz-testi
        run: make demo-selftest

      # DENEME/ yalnız kırmızı yolu gösterir. Makale metni taşımayan sentetik
      # temiz kök iki gerçek kapıdan rc=0 geçmeli; beş kenar kökü beklenen rc'yi
      # vermeli. Fikstürler tempfile altında üretilir, DENEME/ değişmez.
      - name: Sentetik temiz teslim + 5 kenar
        run: make temiz-teslim

      # Demo bilerek rc=1 doner; bu adim "kirmizi gercekten geldi mi" sorusunu
      # sorar. rc=0 (kirmizi yanmadi) veya rc=2 (fikstur bozuk) basarisizdir.
      - name: Demo beklenen kirmiziyi veriyor
        run: |
          # Kanonik yol: ./demo. Kabuk kodu dogrudan betikten gelir.
          set +e
          out=$(./demo 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "kanonik ./demo rc=$rc"
          test "$rc" -eq 1
          echo "$out" | grep -q "BEKLENEN KIRMIZI"
          ! echo "$out" | grep -q "FIKSTUR DEGISTI"

          # Sarmalayici sapmasi belgelenmis ve olculmus olmali: make her
          # tarif hatasinda 2 doner; 1/2 ayrimini tasimaz.
          set +e
          make demo >/dev/null 2>&1
          rc2=$?
          set -e
          echo "make demo rc=$rc2"
          test "$rc2" -eq 2

      # Tasinabilir kanit paketi. Varsayilan make kanit ignored kanit-cikti/
      # yolunu kullanir; izlenen attestation.json degismez.
      - name: Kanit paketi uret
        run: make kanit

      # Paket yalniz dosya var mi diye degil; sema, attestation, manifest ve
      # ham komut kayitlari capraz dogrulanmadan gecmez.
      - name: Kanit paketi dogrula
        run: make kanit-paket-dogrula

      # Gecici bir paket uzerinde sema ve bulgu kimligi bozulmalarinin
      # PAKET-01/05/06 ile kirmizi oldugunu olcer; ana agaci kirletmez.
      - name: Kanit paketi oz-testi
        run: make kanit-paket-selftest

      # Makbuz, her komutun argv'sini, cikis kodunu ve ham satirini ayni
      # paketteki sonuc.json, attestation ve komut loglariyla birlestirir.
      - name: Dogrulama makbuzunu denetle
        run: make makbuz-dogrula

      # Paket uretimi izlenen agacta degisiklik birakmamali.
      - name: Kanit paketi commit'i kirletmedi
        run: test -z "$(git status --porcelain --untracked-files=no)"

      # Upload basarisiz olursa veya paket yoksa adim kirmizi olur; ayni
      # artifact, Actions arayuzunden ve `gh run download` ile indirilebilir.
      - name: Kanit paketini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: atlas-kanit-paketi
          path: kanit-paketi/
          if-no-files-found: error
          retention-days: 14

  iddia:
    name: iddia defteri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: python3 -m pip install --quiet -r requirements-dev.txt

      # Hizli kip sozlesmesi: agir satirlar kosmadan ATLANDI olmali ve PASS
      # sayilmamali; tam kosunun fail-closed davranisi da bu testte sınanir.
      - name: Iddia hizli kip sozlesmesi
        run: make iddia-selftest

      # README/docs sayilari iddia defterinden olculur; bayat sayi yesil CI ile
      # yayilanamaz. FAIL satiri hangi beyanin hangi kaynakla uyusmadigini basar.
      - name: make iddia
        run: make iddia

  # Haftalik public parite: public klonda ozel lab yoktur; ayni agac
  # kendisiyle karsilastirilir. `yayinla.py` kuru kosusu sifir fark
  # vermezse (rc=1) adim kirmizi olur. Manifest denetimi `dogrula`
  # isinde ayrica kosar; bu is yalniz yayin kapsami/aktarim listesi
  # uyusmazligini haftalik olarak olcer.
  yayin-parite:
    name: yayin paritesi (haftalik)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public = mekanizma (kuru kosu)
        run: python3 tools/yayinla.py --lab .
