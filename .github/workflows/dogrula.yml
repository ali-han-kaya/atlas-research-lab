name: dogrula

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Haftalık: bağımlılıksız araçlar sessizce çürümesin.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogrula:
    name: tek giris dogrulama
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surumler
        run: python3 --version && bash --version | head -1

      - name: Bagimliliklar
        run: python3 -m pip install --quiet -r requirements-dev.txt

      # Runner kipi: hijyen, sözdizimi, sır taraması, sır kapısı öz-testi ve
      # Toolkit hükme girer. ATLAS/KOD paketleri koşar ama RAPOR olarak basılır —
      # ikisi de yerel modele/tarihçeye bağlıdır. Kabul edilen borç (T1) iş
      # özetine yazılır; 7/8 ile yeşil CI arasındaki fark gizlenmez.
      - name: make dogrula-ci
        run: make dogrula-ci

      # Kapı kanıtı: her kural için temiz taban + tek ihlal + kırmızı hüküm.
      # Model, ağ ve yerel katalog gerektirmez; bu yüzden runner'da hükme girer.
      - name: make mutasyon
        run: make mutasyon

      # Tablo elle yazilmaz; kapi envanteri degisip tablo bayatlarsa kirmizi.
      - name: Mutasyon kapsami guncel mi
        run: make kapsam

      # Bulgular gizlenmez: her biri docs/GUVENLIK.md icinde adiyla listelenir;
      # listede olmayan yeni bulgu cikarsa adim kirmizi doner.
      - name: Bagimlilik denetimi (pip-audit)
        run: make guvenlik

      # Surumler sabit oldugu icin rapor her runner'da ayni olmali; farkliysa
      # ortam cozunurlugu kaymis demektir ve bu sessizce gecmemeli.
      - name: Guvenlik raporu guncel mi
        run: git diff --exit-code docs/GUVENLIK.md

      # Demo bilerek rc=1 doner; bu adim "kirmizi gercekten geldi mi" sorusunu
      # sorar. rc=0 (kirmizi yanmadi) veya rc=2 (fikstur bozuk) basarisizdir.
      - name: Demo beklenen kirmiziyi veriyor
        run: |
          # Kanonik yol: ./demo. Kabuk kodu dogrudan betikten gelir.
          set +e
          out=$(./demo 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "kanonik ./demo rc=$rc"
          test "$rc" -eq 1
          echo "$out" | grep -q "BEKLENEN KIRMIZI"
          ! echo "$out" | grep -q "FIKSTUR DEGISTI"

          # Sarmalayici sapmasi belgelenmis ve olculmus olmali: make her
          # tarif hatasinda 2 doner; 1/2 ayrimini tasimaz.
          set +e
          make demo >/dev/null 2>&1
          rc2=$?
          set -e
          echo "make demo rc=$rc2"
          test "$rc2" -eq 2
