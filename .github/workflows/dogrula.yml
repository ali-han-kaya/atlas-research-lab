name: dogrula

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Haftalık: bağımlılıksız araçlar sessizce çürümesin.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogrula:
    name: tek giris dogrulama
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Kanit kendi commit'ini degil, uretildigi HEAD'i cikalar; kayitli
          # commit'in runner'da cozulmesi icin tam gecmis gerekir.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surumler
        run: python3 --version && bash --version | head -1

      - name: Bagimliliklar
        run: python3 -m pip install --quiet -r requirements-dev.txt

      # DURUM.md elle yazilmaz. Bu adim ATLAS/KOD oz-testlerini yeniden kosar,
      # pinli envanter ve SURUM C15f bloguyla karsilastirir; sayfa bayatsa kirmizi.
      - name: DURUM sayfasi guncel mi
        run: make durum-kontrol

      # Sayfa/pin/canli sapmalarin rc!=0 verdigini gecici kokte kanitla.
      # Bu adim yalnizca dosya karsilastiran bir kisayolu ve devre disi canli
      # testleri kirmizi yakalar; gercek agaca yazmaz.
      - name: DURUM negatif testleri
        run: make durum-selftest

      # Ham agac: H4'un kendi tarayicisindan bagimsiz, dogrudan secret_scan.
      # Once agacin temiz oldugunu dogrula; boylece "--tum" yalniz izlenen
      # agaci tarar. Gercek sir (P0) veya KISMI mod cikisi bu adimi kirmizi yapar.
      - name: Ham sir taramasi (secret_scan --tum)
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 KOD_SABLONLAR/scripts/secret_scan.py --tum

      # Runner kipi: aynı kurallar, ayrı muafiyet yok. Sekiz kalemin tamamı
      # koşar; T1 (OLG-1) bu ağacın attestation.json kanıtıyla çalışır ve
      # çıktısında kendi commit/tree çıpasını basar
      # (ör. `OZ-TEST: 145/145 gecti · KANIT commit=<sha> tree=<sha>`).
      # Bir kalem koşmazsa satır
      # `KABUL EDİLEN BORÇ: <id> koşmuyor — <sebep>` olarak görünür ve PASS
      # sayılmaz; koşan 8/8 ile eksik koşu arasındaki fark gizlenmez.
      - name: make dogrula-ci
        run: make dogrula-ci

      # Agac kaniti: gercek commit + dosya sha256'lari + guncel agac uyumu.
      # Kayitli commit'in cozulmesi icin checkout tam gecmisi indirir.
      - name: Agac kaniti guncel mi
        run: make kanit-dogrula

      # Kapı kanıtı: her kural için temiz taban + tek ihlal; hata vakasında kırmızı,
      # beklenen-bulgu vakasında işaretli bulgu.
      # Model, ağ ve yerel katalog gerektirmez; bu yüzden runner'da hükme girer.
      - name: make mutasyon
        run: make mutasyon

      # Tablo elle yazilmaz; kapi envanteri degisip tablo bayatlarsa kirmizi.
      - name: Mutasyon kapsami guncel mi
        run: make kapsam

      # Bulgular gizlenmez: her biri docs/GUVENLIK.md icinde adiyla listelenir;
      # listede olmayan yeni bulgu cikarsa adim kirmizi doner.
      - name: Bagimlilik denetimi (pip-audit)
        run: make guvenlik

      # Surumler sabit oldugu icin rapor her runner'da ayni olmali; farkliysa
      # ortam cozunurlugu kaymis demektir ve bu sessizce gecmemeli.
      - name: Guvenlik raporu guncel mi
        run: git diff --exit-code docs/GUVENLIK.md

      # Demo 0/2: gecici fiksturlerle yesil (rc=0) ve bozuk (rc=2) sozlesmesini
      # ayri ayri dogrula. DENEME/ degismez; kaynak yalnizca gecici kopyada okunur.
      - name: Demo 0/2 öz-testi
        run: make demo-selftest

      # DENEME/ yalnız kırmızı yolu gösterir. Makale metni taşımayan sentetik
      # temiz kök iki gerçek kapıdan rc=0 geçmeli; beş kenar kökü beklenen rc'yi
      # vermeli. Fikstürler tempfile altında üretilir, DENEME/ değişmez.
      - name: Sentetik temiz teslim + 5 kenar
        run: make temiz-teslim

      # Demo bilerek rc=1 doner; bu adim "kirmizi gercekten geldi mi" sorusunu
      # sorar. rc=0 (kirmizi yanmadi) veya rc=2 (fikstur bozuk) basarisizdir.
      - name: Demo beklenen kirmiziyi veriyor
        run: |
          # Kanonik yol: ./demo. Kabuk kodu dogrudan betikten gelir.
          set +e
          out=$(./demo 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "kanonik ./demo rc=$rc"
          test "$rc" -eq 1
          echo "$out" | grep -q "BEKLENEN KIRMIZI"
          ! echo "$out" | grep -q "FIKSTUR DEGISTI"

          # Sarmalayici sapmasi belgelenmis ve olculmus olmali: make her
          # tarif hatasinda 2 doner; 1/2 ayrimini tasimaz.
          set +e
          make demo >/dev/null 2>&1
          rc2=$?
          set -e
          echo "make demo rc=$rc2"
          test "$rc2" -eq 2

      # Tasinabilir kanit paketi. CI'da attestation'i RUNNER_TEMP'e yaz: izlenen
      # attestation.json degismez, boylece artifact adimi commit'i kirletmez.
      - name: Kanit paketi uret
        run: make kanit KANIT_ARGS="--cikti $RUNNER_TEMP/atlas-attestation.json"

      # Paket yalniz dosya var mi diye degil; sema, attestation, manifest ve
      # ham komut kayitlari capraz dogrulanmadan gecmez.
      - name: Kanit paketi dogrula
        run: make kanit-paket-dogrula

      # Paket uretimi izlenen agacta degisiklik birakmamali.
      - name: Kanit paketi commit'i kirletmedi
        run: test -z "$(git status --porcelain --untracked-files=no)"

      # Upload basarisiz olursa veya paket yoksa adim kirmizi olur; ayni
      # artifact, Actions arayuzunden ve `gh run download` ile indirilebilir.
      - name: Kanit paketini artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: atlas-kanit-paketi
          path: kanit-paketi/
          if-no-files-found: error
          retention-days: 14

  iddia:
    name: iddia defteri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: python3 -m pip install --quiet -r requirements-dev.txt

      # README/docs sayilari iddia defterinden olculur; bayat sayi yesil CI ile
      # yayilanamaz. FAIL satiri hangi beyanin hangi kaynakla uyusmadigini basar.
      - name: make iddia
        run: make iddia
